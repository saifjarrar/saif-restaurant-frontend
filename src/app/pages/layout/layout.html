<header class="navbar" [class.menu-open]="menuOpen()">
  <a class="brand" routerLink="/layout/dashboard" aria-label="Saif Restaurant home">
    <span class="mark">
      <svg viewBox="0 0 24 24">
        <path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z" />
        <path d="M8.5 12l2.5 2.5 4.5-5" />
      </svg>
    </span>
    <span class="brand-name">Saif Restaurant</span>
  </a>

  <!-- NEW: hamburger button, visible only on small screens -->
  <button
    class="burger"
    type="button"
    aria-label="Menu"
    [attr.aria-expanded]="menuOpen()"
    (click)="toggleMenu()"
  >
    <span></span><span></span><span></span>
  </button>

  <!-- NEW: panel wraps the links and the logout button -->
  <div class="panel">
    <!-- NEW: (click)="closeMenu()" closes the menu after choosing a page -->
    <nav class="links" aria-label="Main" (click)="closeMenu()">
      @if (auth.isAdmin()) {
        <a class="link" routerLink="/layout/dashboard" routerLinkActive="active" title="Dashboard">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="7.5" height="9" rx="2" />
            <rect x="13.5" y="3" width="7.5" height="5" rx="2" />
            <rect x="13.5" y="11" width="7.5" height="10" rx="2" />
            <rect x="3" y="15" width="7.5" height="6" rx="2" />
          </svg>
          <span>Dashboard</span>
        </a>
      }

      <a class="link" routerLink="/layout/menu" routerLinkActive="active" title="Menu">
        <svg viewBox="0 0 24 24">
          <path d="M4 3v5a3 3 0 0 0 6 0V3" />
          <path d="M7 3v18" />
          <path d="M17 21V3c-2.5 1.5-3.5 4-3.5 7v3H17" />
        </svg>
        <span>Menu</span>
      </a>

      <a
        class="link"
        routerLink="/layout/reservation"
        routerLinkActive="active"
        title="Reservations"
      >
        <svg viewBox="0 0 24 24">
          <rect x="3" y="5" width="18" height="16" rx="3" />
          <path d="M3 10h18" />
          <path d="M8 3v4" />
          <path d="M16 3v4" />
        </svg>
        <span>Reservations</span>
      </a>

      @if (auth.isAdmin()) {
        <a class="link" routerLink="/layout/orders" routerLinkActive="active" title="Orders">
          <svg viewBox="0 0 24 24">
            <path d="M6 8h12l1 12H5z" />
            <path d="M9 8a3 3 0 0 1 6 0" />
          </svg>
          <span>Orders</span>
        </a>
      }

      <a class="link" routerLink="/layout/offers" routerLinkActive="active" title="Offers">
        <svg viewBox="0 0 24 24">
          <path d="M3 11V4h7l11 11-7 7z" />
          <circle cx="7.5" cy="8.5" r="1" />
        </svg>
        <span>Offers</span>
      </a>

      <a class="link" routerLink="/layout/contact" routerLinkActive="active" title="Contact">
        <svg viewBox="0 0 24 24">
          <path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z" />
        </svg>
        <span>Contact</span>
      </a>
    </nav>

    <button class="logout" type="button" (click)="onLogout()">
      <span>Log out</span>
      <svg viewBox="0 0 24 24">
        <path d="M9 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3" />
        <path d="M16 17l5-5-5-5" />
        <path d="M21 12H9" />
      </svg>
    </button>
  </div>
</header>
<router-outlet></router-outlet>
