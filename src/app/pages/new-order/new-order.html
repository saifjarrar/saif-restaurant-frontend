<div class="overlay">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="no-title">
    <header class="m-head">
      <div>
        <h2 id="no-title">New order</h2>
        <p>Choose a table and the dishes, then send the order to the kitchen.</p>
      </div>
      <button class="close" type="button" aria-label="Close" (click)="onDashboard()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
    </header>

    <div class="m-body" [formGroup]="form">
      <div class="field">
        <label for="no-table">Table</label>
        <select id="no-table" formControlName="table">
          <option value="" disabled>Choose a table</option>
          <option>Table 1</option>
          <option>Table 2</option>
          <option>Table 3</option>
          <option>Table 4</option>
          <option>Table 5</option>
          <option>Table 6</option>
          <option>Table 7</option>
          <option>Table 8</option>
          <option>Terrace</option>
        </select>

        @if (form.controls.table.touched && form.controls.table.invalid) {
          <p class="error-text">Please choose a table</p>
        }
      </div>

      <fieldset class="dishes" formArrayName="dishes">
        <legend>Dishes</legend>

        @for (row of dishes.controls; track row; let i = $index) {
          <div class="dish-row" [formGroupName]="i">
            <select aria-label="Dish" formControlName="name">
              <option value="" disabled>Choose a dish</option>
              <optgroup label="Starters">
                <option>Hummus</option>
                <option>Falafel</option>
                <option>Fattoush Salad</option>
                <option>Mutabbal</option>
                <option>Kibbeh</option>
              </optgroup>
              <optgroup label="Mains">
                <option>Chicken Shawarma</option>
                <option>Beef Kofta</option>
                <option>Mansaf</option>
                <option>Lamb Tagine</option>
                 <option>Beef Burger</option>
              </optgroup>
              <optgroup label="Grills">
                <option>Grilled Chicken</option>
                <option>Grilled Salmon</option>
                <option>Grilled sea bass</option>
                <option>Shish Tawook</option>
                <option>Grilled Lamb Chops</option>
              </optgroup>
              <optgroup label="Desserts">
                <option>Knafeh</option>
                <option>Baklava</option>
                <option>Chocolate Mousse</option>
                <option>Rice Pudding</option>
              </optgroup>
              <optgroup label="Drinks">
                <option>Mint lemonade</option>
                <option>Pomegranate Juice</option>
                <option>Turkish Coffee</option>
                <option>Arabic Tea</option>
                <option>Rose Water Lemonade</option>
              </optgroup>
            </select>

            <input type="number" min="1" formControlName="quantity" aria-label="Quantity" />

            <button
              class="remove"
              type="button"
              aria-label="Remove this dish"
              [disabled]="dishes.length === 1"
              (click)="removeDish(i)"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
            </button>
          </div>
        }

        <button class="add" type="button" (click)="addDish()">+ Add another dish</button>
      </fieldset>

      <div class="field">
        <label for="no-notes">Notes <span class="opt">(optional)</span></label>
        <textarea id="no-notes" rows="3" placeholder="Allergies, no onions, birthday..."></textarea>
      </div>

      @if (errorMessage()) {
        <p class="error-text">{{ errorMessage() }}</p>
      }
    </div>

    <footer class="m-foot">
  <button class="btn ghost" type="button" (click)="onDashboard()">Cancel</button>
  <button class="btn" type="button" [disabled]="isSending()" (click)="send()">
    {{ isSending() ? 'Sending...' : 'Send to kitchen' }}
  </button>
</footer>
  </section>
</div>
